<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guzza · Perrot Tech</title>
<meta name="description" content="Prototipo Perrot Tech para Guzza: control financiero, clientes e inventario con agentes de IA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F6F4F9; --surface:#FFFFFF; --surface2:#F1ECF7; --line:#E3DCEC; --line2:#CFC4DE;
  --ink:#1E1430; --ink2:#5E5470; --ink3:#8E859E;
  --acai:#4A2170; --acai2:#7B45A6; --acai-soft:#EDE3F6; --brand:#4A2170; --brand2:#2E1147;
  --pt:#1E5BFF; --pt2:#3DD9C0;
  --banana:#F2C94C; --banana-soft:#FFF6D8;
  --ok:#1F9D6B; --ok-bg:#E3F5EC; --warn:#B86E00; --warn-bg:#FFF2DB; --crit:#C7362B; --crit-bg:#FBE5E2;
  --wa:#0B7A5E; --wa-bg:#EFE7DE; --wa-me:#D9FDD3; --wa-them:#FFFFFF; --wa-head:#075E54;
  --ig1:#F58529; --ig2:#DD2A7B; --ig3:#8134AF; --ig4:#515BD4; --ig-me:#3797F0; --ig-them:#EFEFEF;
  --g-star:#F4B400;
  --ic-fin:#1E5BFF; --ic-cli:#DD2A7B; --ic-inv:#0E8C7A; --ic-fra:#D9822B;
  --shadow:0 1px 2px rgba(30,20,48,.06),0 8px 24px rgba(30,20,48,.07);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#120C1B; --surface:#1B1328; --surface2:#241A35; --line:#2F2442; --line2:#40325A;
    --ink:#EFE9F7; --ink2:#B5AAC7; --ink3:#857A99;
    --acai:#C29BE6; --acai2:#9C6BC9; --acai-soft:#2C1F40; --brand:#3A1A5A; --brand2:#240E38;
    --pt:#6C93FF;
    --banana-soft:#3A3014;
    --ok:#3DC98B; --ok-bg:#12352A; --warn:#F0A83A; --warn-bg:#3A2C10; --crit:#F0655A; --crit-bg:#3E1A17;
    --wa:#3DC9A0; --wa-bg:#0E1512; --wa-me:#144D37; --wa-them:#1F2C33; --wa-head:#1F2C33;
    --ig-them:#262626;
    --shadow:none;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Montserrat,system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pt);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1060px;margin:0 auto;padding-inline:16px}
[hidden]{display:none!important}

/* barra */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.top .cl{font:800 19px Montserrat,sans-serif;letter-spacing:.02em}
.top .cl small{display:block;font:600 10px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.top .by{margin-left:auto;display:flex;align-items:center;gap:8px;font:800 11px Montserrat,sans-serif;letter-spacing:.08em}
.top .by span{color:var(--pt2)}
.back{appearance:none;border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:8px 12px 8px 8px;display:flex;align-items:center;gap:6px;font:700 13px Montserrat,sans-serif;cursor:pointer}
.back svg{width:18px;height:18px}
.top .ttl{font:800 16px Montserrat,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo{background:var(--banana);color:#3A2A00;font:600 12px "IBM Plex Sans",sans-serif;text-align:center;padding:5px 12px}
.chips{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.chips .in{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;max-width:1060px;margin:0 auto;scrollbar-width:none}
.chips .in::-webkit-scrollbar{display:none}
.chip{appearance:none;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:7px 13px;font:600 12px Montserrat,sans-serif;cursor:pointer;color:var(--ink2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

main{padding-block:22px 48px}
section{margin-top:30px;scroll-margin-top:130px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sh h2{font-size:18px;font-weight:800}
.sh .n{font-size:12px;color:var(--ink3)}
.lead{color:var(--ink2);margin:-6px 0 14px;max-width:70ch;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.bd{padding:16px}
.muted{color:var(--ink3)} .small{font-size:12px}
.note{font-size:12px;color:var(--ink3);margin-top:10px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.btn{appearance:none;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font:700 13px Montserrat,sans-serif;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ban{background:var(--banana);border-color:var(--banana);color:#2B1F00}
.btn.sm{padding:6px 10px;font-size:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font:600 11px Montserrat,sans-serif;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-crit{background:var(--crit-bg);color:var(--crit)} .p-acai{background:var(--acai-soft);color:var(--acai)}

/* inicio */
.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:22px;padding:28px 22px;position:relative;overflow:hidden}
.hero .ey{font:600 11px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--banana)}
.hero h1{font-size:clamp(26px,5vw,42px);font-weight:800;margin-top:10px;line-height:1.08;max-width:17ch}
.hero p{margin:12px 0 0;max-width:54ch;color:rgba(255,255,255,.86)}
.hero .berries{position:absolute;right:-30px;bottom:-40px;width:210px;height:210px}
.hero>*:not(.berries){position:relative;z-index:1}
@media(max-width:640px){.hero{padding-bottom:120px}.hero .berries{width:150px;height:150px;right:-20px;bottom:-30px}}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.apps{grid-template-columns:minmax(0,1fr)}}
.app{appearance:none;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:12px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.app:hover{transform:translateY(-2px);border-color:var(--acai2)}
.app .ic{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;color:#fff}
.app .ic svg{width:32px;height:32px}
.app h3{font-size:19px;font-weight:800}
.app p{margin:0;color:var(--ink2);font-size:14px}
.app ul{margin:0;padding-left:18px;color:var(--ink2);font-size:13px;display:grid;gap:3px}
.app .go{font:700 13px Montserrat,sans-serif;color:var(--acai)}
.steps{display:grid;gap:12px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:14px}
.step b.n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--acai-soft);color:var(--acai);font:800 14px Montserrat,sans-serif}
.vision{background:#0F1C2E;color:#EAF0FF;border-radius:18px;padding:22px;display:grid;gap:10px}
.vision .ey{font:600 11px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--pt2)}
.vision h3{font-size:20px}
.vision p{margin:0;color:#B9C4D8;max-width:66ch}
.pt-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
.pt-card .wm{font:800 16px Montserrat,sans-serif;letter-spacing:.08em;color:var(--ink)}
.pt-card .wm span{color:var(--pt)}
.pt-card .ct{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:14px}
.pt-card .ct b{display:block;font:600 10px Montserrat,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}

/* kpis y gráficos */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:3px;min-height:98px;box-shadow:var(--shadow)}
.kpi .v{font:800 24px/1.1 Montserrat,sans-serif;letter-spacing:-.02em}
.kpi .v small{font-size:13px;color:var(--ink2);font-weight:600;margin-left:2px}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .d{font-size:11px;color:var(--ink3);margin-top:auto}
.kpi.hi{border-color:var(--acai2)} .kpi.hi .v{color:var(--acai)}
.v.bad{color:var(--crit)} .v.good{color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:none;padding:8px 12px;font:600 12px Montserrat,sans-serif;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:600 10px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;white-space:nowrap}
.hb{display:grid;gap:12px}
.hbr{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hbr .tr{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;display:flex}
.hbr .tr i{display:block;height:100%}
.hbr .v{font-weight:600;white-space:nowrap}
.stack{height:22px;border-radius:8px;overflow:hidden;display:flex;margin:8px 0 10px}
.stack i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.days{display:flex;align-items:flex-end;gap:3px;height:120px;padding:10px 0 0}
.days i{flex:1;border-radius:4px 4px 0 0;background:var(--acai2);min-width:4px;opacity:.85}
.days i.we{background:var(--acai)}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:start}
.alert:last-child{border-bottom:0}
.alert .dot{width:10px;height:10px;border-radius:50%;margin-top:6px}
.alert .t{font-weight:600}
.alert .m{font-size:13px;color:var(--ink2);margin-top:2px}
.ask{display:flex;flex-wrap:wrap;gap:8px}
.answer{margin-top:12px;background:var(--acai-soft);border-radius:12px;padding:14px;font-size:14px;min-height:60px}
.answer .who{font:700 11px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--acai);margin-bottom:4px}
.heat{display:grid;grid-template-columns:34px repeat(12,minmax(0,1fr));gap:3px;font-size:10px;color:var(--ink3);min-width:420px}
.heat .c{aspect-ratio:1/1;border-radius:4px}
.heat .h{text-align:center}
.heat .d{display:flex;align-items:center}

/* teléfonos */
.phone{border-radius:34px;border:9px solid #17111F;overflow:hidden;max-width:360px;width:100%;margin:0 auto;box-shadow:0 20px 40px rgba(20,10,40,.18);background:#fff}
.phone .notch{height:22px;background:#17111F;display:flex;justify-content:center}
.phone .notch i{width:90px;height:16px;background:#000;border-radius:0 0 12px 12px}
.demo-grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.demo-grid{grid-template-columns:minmax(0,1fr)}}
.side{display:grid;gap:14px}
.flow{display:grid;gap:8px}
.flow .fi{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;align-items:start}
.flow .fi b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--acai-soft);color:var(--acai);font:800 12px Montserrat,sans-serif}
.flow .fi.on b{background:var(--brand);color:#fff}
.agentnote{background:var(--surface);border:1px dashed var(--line2);border-radius:14px;padding:14px;font-size:13px;color:var(--ink2)}
.agentnote b{color:var(--ink)}

/* Instagram */
.ig{background:#fff;color:#111;font-size:14px}
.ig .hd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #eee}
.ig .av{width:32px;height:32px;border-radius:50%;padding:2px;background:linear-gradient(45deg,var(--ig1),var(--ig2),var(--ig3));flex:none}
.ig .av i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#4A2170;border:2px solid #fff;color:#fff;font:800 12px Montserrat,sans-serif;font-style:normal}
.ig .hd b{font-size:14px} .ig .hd small{display:block;font-size:11px;color:#777}
.ig .post{aspect-ratio:1/1;background:radial-gradient(circle at 60% 55%,#7B45A6 0 28%,transparent 29%),radial-gradient(circle at 35% 40%,#F2C94C 0 9%,transparent 10%),radial-gradient(circle at 70% 30%,#E0405A 0 8%,transparent 9%),radial-gradient(circle at 45% 70%,#fff 0 7%,transparent 8%),linear-gradient(160deg,#EADCF7,#CDB4E8);position:relative}
.ig .post span{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font:700 12px Montserrat,sans-serif;padding:4px 8px;border-radius:6px}
.ig .acts{display:flex;gap:14px;padding:8px 12px;font-size:20px}
.ig .acts svg{width:22px;height:22px}
.ig .cm{padding:0 12px 10px;display:grid;gap:6px;font-size:13px}
.ig .cm .c{display:flex;gap:6px;align-items:baseline}
.ig .cm .c b{font-weight:700}
.ig .cm .rep{margin-left:18px;color:#555;font-size:12px}
.ig .cm button{appearance:none;border:1px solid #ddd;background:#fafafa;border-radius:999px;padding:6px 10px;font:600 12px "IBM Plex Sans",sans-serif;cursor:pointer;justify-self:start;color:#111}
.igdm{background:#fff;color:#111;height:520px;display:flex;flex-direction:column}
.igdm .msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.igdm .m{max-width:80%;padding:8px 12px;border-radius:18px;font-size:14px;line-height:1.35;white-space:pre-line}
.igdm .m.them{background:#EFEFEF;align-self:flex-start;color:#111}
.igdm .m.me{background:var(--ig-me);align-self:flex-end;color:#fff}
.igdm .sys{align-self:center;font-size:11px;color:#888;margin:4px 0}
.carousel{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;align-self:stretch;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.pcard{flex:0 0 150px;border:1px solid #e5e5e5;border-radius:14px;overflow:hidden;background:#fff}
.pcard .img{height:96px;display:grid;place-items:center}
.pcard .tx{padding:8px 10px;font-size:12px;color:#111}
.pcard .tx b{display:block;font-size:13px}
.pcard button{appearance:none;width:100%;border:0;border-top:1px solid #eee;background:#fff;padding:8px;font:600 12px "IBM Plex Sans",sans-serif;color:#0095F6;cursor:pointer}
.qr-row{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-end;justify-content:flex-end}
.qr-row button{appearance:none;border:1px solid #0095F6;background:#fff;color:#0095F6;border-radius:999px;padding:6px 12px;font:600 12px "IBM Plex Sans",sans-serif;cursor:pointer}
.bowl{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#5B2A86 0 55%,transparent 56%);position:relative}
.bowl::after{content:"";position:absolute;left:4px;right:4px;bottom:2px;height:30px;border-radius:0 0 34px 34px;background:#F4EFE6;border-top:3px solid #E8DCC8}

/* WhatsApp */
.wa{background:var(--wa-bg);display:flex;flex-direction:column;height:560px}
.wa .hd{background:var(--wa-head);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px}
.wa .av{width:34px;height:34px;border-radius:50%;background:#4A2170;display:grid;place-items:center;font:800 13px Montserrat,sans-serif;color:#fff;flex:none}
.wa .hd b{font-size:14px;display:block} .wa .hd small{font-size:11px;opacity:.85}
.wa .chat{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:7px}
.msg{max-width:84%;padding:7px 10px 5px;border-radius:10px;font-size:14px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-line;color:var(--ink)}
.msg.them{background:var(--wa-them);align-self:flex-start;border-top-left-radius:2px}
.msg.me{background:var(--wa-me);align-self:flex-end;border-top-right-radius:2px}
.msg .tm{display:block;text-align:right;font-size:10px;color:var(--ink3);margin-top:2px}
.opts{display:grid;gap:6px;align-self:stretch;margin-inline:2px}
.opts button{appearance:none;border:0;background:var(--wa-them);color:var(--wa);font:600 14px "IBM Plex Sans",sans-serif;padding:9px;border-radius:10px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.opts button.on{background:var(--wa);color:#fff}
.opts button:disabled{opacity:.5}
.opts .row{display:flex;flex-wrap:wrap;gap:6px}
.opts .row button{flex:1 1 auto;font-size:13px;padding:8px 10px}
.opts .prod{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;text-align:left}
.opts .prod .bowl{width:44px;height:44px}
.opts .prod .bowl::after{height:20px;border-radius:0 0 24px 24px}
.ticket{border:2px dashed var(--line2);border-radius:16px;padding:16px;background:var(--surface)}
.ticket .code{font:800 24px Montserrat,sans-serif;color:var(--acai)}
.ticket ul{margin:8px 0 0;padding-left:18px}

/* Google */
.review{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.review:last-child{border-bottom:0}
.review .who{display:flex;align-items:center;gap:10px}
.review .who i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 13px Montserrat,sans-serif;font-style:normal}
.stars{color:var(--g-star);letter-spacing:1px;font-size:14px}
.stars .off{color:var(--line2)}
.draft{background:var(--acai-soft);border-radius:12px;padding:12px;font-size:13px}
.draft .who2{font:700 11px Montserrat,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--acai);margin-bottom:4px}
.gscore{display:flex;align-items:center;gap:14px}
.gscore .big{font:800 44px/1 Montserrat,sans-serif}

/* sellos */
.stamp-card{background:linear-gradient(135deg,var(--brand),#7B45A6);color:#fff;border-radius:22px;padding:20px;box-shadow:0 14px 30px rgba(74,33,112,.3);max-width:420px}
.stamp-card .t{font:800 18px Montserrat,sans-serif}
.stamp-card .s{font-size:12px;opacity:.85}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
.slot{aspect-ratio:1/1;border-radius:50%;border:2px dashed rgba(255,255,255,.5);display:grid;place-items:center;font:800 12px Montserrat,sans-serif}
.slot.on{background:var(--banana);border:0;color:#3A2A00;animation:pop .3s ease}
.slot.gift{background:#fff;color:var(--brand);border:0}
.slot.prize{border-style:solid;border-color:var(--banana);color:var(--banana)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.qr{width:120px;height:120px;flex:none;background:#fff;border-radius:12px;padding:9px;display:grid;grid-template-columns:repeat(21,1fr);grid-template-rows:repeat(21,1fr);box-shadow:inset 0 0 0 1px #e5e0ee}
.qr i{background:#fff}
.qr i.k{background:#1b1030}

/* embudo */
.funnel{display:grid;gap:8px}

let WA={msgs:[],step:"inicio",local:null,size:null,tops:[],hora:null,code:null,sent:false};

const waBot=t=>WA.msgs.push({me:false,t,h:hora()}), waMe=t=>WA.msgs.push({me:true,t,h:hora()});
function waOpts(){
  const s=WA.step;
  if(s==="inicio")return `<div class="opts"><button data-wa="pedir">Pedir para retirar</button><button data-wa="carta">Ver la carta</button><button data-wa="horario">Locales y horarios</button></div>`;

  if(s==="size")return `<div class="opts">${PROD.slice(0,3).map((p,i)=>`<button class="prod" data-wa="size:${i}"><div class="bowl"></div><span><b>${p.corto}</b><br><small>${p.top} toppings incluidos</small></span><b>${clp(p.precio)}</b></button>`).join("")}</div>`;
  if(s==="tops"){const max=PROD[WA.size].top;return `<div class="opts"><div class="row">${TOPS.slice(0,10).map((t,i)=>`<button class="${WA.tops.includes(i)?"on":""}" data-wa="top:${i}">${t}</button>`).join("")}</div><button data-wa="topsok" ${WA.tops.length?"":"disabled"}>Listo (${WA.tops.length}/${max})</button></div>`}
  if(s==="hora")return `<div class="opts"><button data-wa="h:Lo antes posible">Lo antes posible (15 min)</button><button data-wa="h:En 30 minutos">En 30 minutos</button><button data-wa="h:En 1 hora">En 1 hora</button></div>`;
  if(s==="pago")return `<div class="opts"><button data-wa="pagar">Pagar con link</button><button data-wa="cambiar">Cambiar el pedido</button></div>`;
  if(s==="fin")return `<div class="opts"><button data-wa="reset">Hacer otro pedido</button></div>`;
  return "";
}
function waAct(a){
  if(a==="reset"){waReset();renderWA();return}
  if(a==="pedir"){waMe("Pedir para retirar");waBot("¿En qué local lo retiras?");WA.step="local"}
  else if(a==="carta"){waMe("Ver la carta");waBot(PROD.map(p=>`${p.nombre}: ${clp(p.precio)}`).join("\n"));WA.step="inicio"}
  else if(a==="horario"){waMe("Locales y horarios");waBot("Llacolen: todos los días 9:30 a 20:30\nMall La Portada: todos los días 10:00 a 20:30");WA.step="inicio"}
  else if(a.startsWith("loc:")){WA.local=+a.slice(4);waMe(LOCALES[WA.local]);waBot("¿Qué tamaño quieres?");WA.step="size"}
  else if(a.startsWith("size:")){WA.size=+a.slice(5);WA.tops=[];waMe(PROD[WA.size].nombre);waBot(`Elige hasta ${PROD[WA.size].top} toppings.\nLo más pedido hoy: granola + plátano.`);WA.step="tops"}
  else if(a.startsWith("top:")){const i=+a.slice(4),max=PROD[WA.size].top;if(WA.tops.includes(i))WA.tops=WA.tops.filter(x=>x!==i);else if(WA.tops.length<max)WA.tops.push(i);renderWA();return}
  else if(a==="topsok"){waMe(WA.tops.map(i=>TOPS[i]).join(", "));waBot("¿Para cuándo lo quieres?");WA.step="hora"}
  else if(a.startsWith("h:")){WA.hora=a.slice(2);waMe(WA.hora);const p=PROD[WA.size];waBot(`Tu pedido:\n${p.nombre}\n${WA.tops.map(i=>TOPS[i]).join(", ")}\nRetiro en ${LOCALES[WA.local]} · ${WA.hora.toLowerCase()}\nTotal: ${clp(p.precio)}`);WA.step="pago"}
  else if(a==="cambiar"){waMe("Cambiar el pedido");waBot("¿Qué tamaño quieres?");WA.step="size"}
  else if(a==="pagar"){waMe("Pagar con link");WA.code="G-"+(1400+Math.floor(Math.random()*90));waBot(`Pago recibido ✅\nPedido ${WA.code} enviado a ${LOCALES[WA.local]}.\nSumaste 1 sello en tu Guzza Club (3 de 10).`);WA.step="fin";WA.sent=true}
  renderWA();
}
function renderWA(){
  const c=$("#chat"); if(!c) return;
  c.innerHTML=WA.msgs.map(m=>`<div class="msg ${m.me?"me":"them"}">${esc(m.t)}<span class="tm">${m.h}</span></div>`).join("")+waOpts();
  c.querySelectorAll("[data-wa]").forEach(b=>b.onclick=()=>waAct(b.dataset.wa));
  c.scrollTop=c.scrollHeight;
  const t=$("#ticket"); if(!t) return;
  if(!WA.sent){t.innerHTML=`<div class="muted">Cuando el cliente paga, el pedido aparece aquí, en la pantalla del local, con su código y hora de retiro.</div>`;return}
  const p=PROD[WA.size];

}

function renderQR(){const el=$("#qr");if(!el)return;let sd=11;const r=()=>{sd=(sd*9301+49297)%233280;return sd/233280};
  const N=21,fin=(x,y,ox,oy)=>{const dx=x-ox,dy=y-oy;if(dx<0||dy<0||dx>6||dy>6)return null;return dx===0||dy===0||dx===6||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4)};
  const sep=(x,y)=>(x<=7&&y<=7)||(x>=N-8&&y<=7)||(x<=7&&y>=N-8);
  el.innerHTML=[...Array(N*N)].map((_,i)=>{const x=i%N,y=Math.floor(i/N);let f=fin(x,y,0,0);if(f===null)f=fin(x,y,N-7,0);if(f===null)f=fin(x,y,0,N-7);if(f===null)f=sep(x,y)?false:(y===6||x===6)?(x+y)%2===0:r()>.52;return `<i class="${f?"k":""}"></i>`}).join("")}

// Modelo del inversionista: flujo antes de impuestos, 5 años
function modelo(venta,capex){
  const F=franq(), M=FRI.modelo;
  const cmBase=F.L[0].a.com/F.L[0].a.venta;
  const pct=[FRI.opex_pct[0][1]??F.ins,cmBase,...FRI.opex_pct.slice(2).map(x=>x[1])];
  const pv=sum(pct), fijo=FRI.fijo_total;
  const eb=v=>v*(1-pv)-fijo;
  const vAnio=t=>t===1?venta*M.ramp:venta*Math.pow(1+M.crec,t-1);
  const tax=M.impuesto||0, dep=Math.max(0,capex-(M.no_depreciable||0))/M.anios;
  const neto=e=>e-Math.max(0,(e-dep)*tax);            // flujo anual después de impuestos
  const netoMes=e=>e-Math.max(0,(e-dep/12)*tax);       // flujo mensual después de impuestos
  const flujos=[-capex];for(let t=1;t<=M.anios;t++)flujos.push(neto(12*eb(vAnio(t)))+(t===M.anios?(M.recupero||0):0));
  const van=r=>flujos.reduce((s,f,t)=>s+f/Math.pow(1+r,t),0);
  let tir=null;if(van(-0.99)>0&&van(5)<0){let lo=-0.99,hi=5;for(let i=0;i<200;i++){const mid=(lo+hi)/2;van(mid)>0?lo=mid:hi=mid}tir=(lo+hi)/2}
  let acc=-capex,pay=null;for(let m=1;m<=M.anios*12;m++){acc+=netoMes(eb(vAnio(Math.ceil(m/12))));if(acc>=0){pay=m;break}}
  return {pct,pv,fijo,equilibrio:fijo/(1-pv),ebMes:eb(venta),ebMes1:eb(venta*M.ramp),flujos,van:van(M.tasa),tir,pay,margen:eb(venta)/venta};
}

  if(app==="franquicia")bindFranq();
}
route(); render();
</script>
